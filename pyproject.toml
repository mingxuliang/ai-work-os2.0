[project]
name = "aiwork"
dynamic = ["version"]
description = "AIWork-OS: enterprise AI workbench on QwenPaw 2.0 kernel (AgentScope 2.x). Forked in-tree for a single deployable product."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "agentscope==2.0.4.post1",
    "httpx>=0.27.0",
    "packaging>=24.0",
    "discord-py>=2.3",
    "dingtalk-stream>=0.24.3",
    "alibabacloud-dingtalk>=2.2.42",
    "alibabacloud-tea-openapi>=0.4.4",
    "alibabacloud-credentials>=0.3.0",
    "alibabacloud-tea-util>=0.3.0",
    "uvicorn>=0.40.0",
    "apscheduler>=3.11.2,<4",
    "playwright>=1.49.0",
    "questionary>=2.1.1",
    "mss>=9.0.0",
    "reme-ai==0.4.1.1",
    "transformers>=4.30.0",
    "python-dotenv>=1.0.0",
    "python-socks>=2.5.3",
    "onnxruntime<1.24",
    "lark-oapi>=1.5.3",
    "python-telegram-bot>=20.0",
    "slack-bolt>=1.22.0",
    "twilio>=9.10.2",
    "pywebview>=4.0",
    "aiofiles>=24.1.0",
    "paho-mqtt>=2.0.0",
    "wecom-aibot-python-sdk==1.0.2",
    "matrix-nio>=0.25.0",
    "shortuuid>=1.0.0",
    "google-genai>=1.67.0",
    "tzdata>=2024.1",
    "cryptography>=43.0.0",
    "keyring>=25.0.0",
    "pyyaml>=6.0",
    "wcmatch>=10.0",
    "json-repair>=0.30.0",
    "segno>=1.6.6",
    "modelscope>=1.35.0",
    "huggingface_hub>=0.20.0",
    "pillow>=10.0.0",
    "agent-client-protocol>=0.9.0,<0.11.0",
    "textual>=8.2.8,<8.2.9",
    "psutil>=6.0.0",
    "openai>=2.0.0,<=2.33.0",
    "anyio>=4.0.0,<4.13.0",
    "watchfiles>=0.22",
    "orjson>=3.9",
    "python-lsp-server[all]>=1.10",
    "ast-grep-cli>=0.20",
    "html2text>=2024.2.26",
    # AIWork-OS enterprise
    "aiomysql>=0.2.0",
    "minio>=7.2.0",
    "pgvector>=0.3.0",
    "asyncpg>=0.29.0",
    "PyJWT>=2.8.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "bcrypt>=4.0.0",
    "psycopg2-binary>=2.9",
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/mingxuliang/aiworkos-7-"
Repository = "https://github.com/mingxuliang/aiworkos-7-"

[tool.setuptools.dynamic]
version = {attr = "aiwork.__version__.__version__"}

[tool.setuptools]
packages = { find = { where = ["src"], include = ["aiwork*"], exclude = ["_legacy_aiwork_1x*"] } }
include-package-data = true

[tool.setuptools.package-data]
"aiwork" = [
    "console/**",
    "agents/md_files/**",
    "agents/skills/**",
    "tokenizer/**",
    "security/tool_guard/rules/**",
    "security/skill_scanner/rules/**",
    "security/skill_scanner/data/**",
    "docs/*.md",
    "app/channels/yuanbao/proto/**",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
aiwork = "aiwork.cli.main:cli"
aiwork-qw2 = "aiwork.cli.main:cli"
qwenpaw = "aiwork.cli.main:cli"
copaw = "aiwork.cli.main:cli"

[project.optional-dependencies]
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.2.1",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.0.0",
]
dev = [
    "pre-commit>=4.2.0",
]
local = [
    "huggingface_hub>=0.20.0",
]
whisper = [
    "openai-whisper>=20231117",
]
full = [
    "aiwork[local,whisper]",
]
sip = [
    "pyVoIP>=1.6.0",
    "dashscope>=1.0.0",
    "dashscope-realtime>=0.1.0",
    "audioop-lts; python_version >= '3.13'",
]
sip-livekit = [
    "aiwork[sip]",
    "livekit>=1.0.0",
    "livekit-api>=0.6.0",
]
# Legacy alias — kernel is now in-tree; kept so old docs keep working.
qw2 = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "p0: critical user flows",
    "p1: supported features",
    "p2: error paths",
    "unit: marks tests as unit tests",
    "contract: marks tests as contract tests",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["src/aiwork"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "src/_legacy_aiwork_1x/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]
